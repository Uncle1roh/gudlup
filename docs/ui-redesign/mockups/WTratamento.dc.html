<style>
body{margin:0;background:#0b1c1c}
a{color:#B7DBAD}a:hover{color:#FAF8DF}
.gl-root{background-image:linear-gradient(180deg,rgba(3,10,10,.82),rgba(3,10,10,.9)),url(../assets/bg-lago.jpg);background-size:cover;background-position:center;background-attachment:fixed}

.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.s2{grid-column:span 2}
