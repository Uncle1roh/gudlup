<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Good Loop — Minha jornada (app)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06140f}
a{color:#B7DBAD}a:hover{color:#FAF8DF}
.gl-m{background-image:linear-gradient(rgba(4,16,13,.25),rgba(4,16,13,.55)),url(../assets/bg-colinas.jpg);background-size:cover;background-position:30% center}
.glass{background:rgba(10,32,27,.44);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(250,248,223,.14)}
.glass-btn{background:rgba(250,248,223,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(250,248,223,.2);color:#FAF8DF;cursor:pointer}

</style>
</helmet>
<div class="gl-m" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 18px 18px; display: flex; flex-direction: column; gap: 14px; font-family: 'DM Sans', system-ui, sans-serif; color: #FAF8DF; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 500; font-size: 26px">Minha jornada</h1>
    <span class="glass-btn" style="height: 36px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; font-size: 13px">12 semanas</span>
  </header>

  <!-- Progress ring -->
  <section class="glass" style="border-radius: 28px; padding: 18px; display: flex; align-items: center; gap: 18px">
    <svg viewBox="0 0 120 120" width="112" height="112" role="img" aria-label="Semana 4 de 12, 33% concluído">
      <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(250,248,223,.14)" stroke-width="10"></circle>
      <circle cx="60" cy="60" r="50" fill="none" stroke="{{accent}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="104.7 314.2" transform="rotate(-90 60 60)"></circle>
      <text x="60" y="58" text-anchor="middle" fill="#FAF8DF" font-family="Outfit, sans-serif" font-size="30">4</text>
      <text x="60" y="78" text-anchor="middle" fill="rgba(250,248,223,.75)" font-family="DM Sans, sans-serif" font-size="12">de 12</text>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #B7DBAD">Sua trilha</span>
      <span style="font-family: Outfit, sans-serif; font-size: 20px; line-height: 1.15">Menos estresse no dia a dia</span>
      <span style="font-size: 13px; color: rgba(250,248,223,.8)">3 de 4 sessões nesta semana</span>
    </div>
  </section>

  <!-- Weeks -->
  <section class="glass" style="border-radius: 28px; padding: 8px 16px; display: flex; flex-direction: column">
    <sc-for list="{{weeks}}" as="w" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(250,248,223,.08)">
        <span style="width: 36px; height: 36px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: {{w.dotBg}}; color: {{w.dotFg}}; border: 1px solid {{w.dotBorder}}">{{w.n}}</span>
        <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 500; opacity: {{w.op}}">{{w.title}}</span>
          <span style="font-size: 12px; color: rgba(250,248,223,.75)">{{w.sub}}</span>
        </div>
        <span style="font-size: 12px; color: {{w.tagColor}}">{{w.tag}}</span>
      </div>
    </sc-for>
  </section>

  <!-- Check-in -->
  <section class="glass" style="border-radius: 24px; padding: 16px; display: flex; align-items: center; gap: 14px">
    <span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: rgba(232,157,100,.3); display: flex; align-items: center; justify-content: center; color: #F2C29A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"></path></svg>
    </span>
    <div style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 15px; font-weight: 500">Check-in de bem-estar</span>
      <span style="font-size: 12px; color: rgba(250,248,223,.8)">Daqui a 3 dias · cerca de 6 min</span>
    </div>
    <a href="#" style="font-size: 13px">Lembrar</a>
  </section>

  <div style="flex: 1"></div>

  <nav class="glass" aria-label="Navegação" style="height: 68px; border-radius: 999px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <a href="Mobile.dc.html" aria-label="Início" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></a>
    <a href="PsiAgenda.dc.html" aria-label="Terapia" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM12 13.6s-3-1.8-3-4a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 2.2-3 4-3 4z"></path></svg></a>
    <a href="Jornada.dc.html" aria-label="Minha jornada" aria-current="page" style="width: 48px; height: 48px; border-radius: 50%; background: #FAF8DF; color: #0B2620; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"></path></svg></a>
    <a href="Protocolos.dc.html" aria-label="Protocolos" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg></a>
    <a href="Beneficios.dc.html" aria-label="Benefícios" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path><path d="M12 9.5v5M9.5 12h5"></path></svg></a>
    <a href="Perfil.dc.html" aria-label="Perfil" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DB189","options":["#3DB189","#7AC69B","#E89D64","#2465AB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3DB189';
    const done = (n, title) => ({ n, title, sub: '4 sessões concluídas', tag: 'Concluída', tagColor: '#B7DBAD', dotBg: accent, dotFg: '#06140f', dotBorder: accent, op: '1' });
    const weeks = [
      done('1', 'Reconhecer o estresse'),
      done('2', 'Respirar com intenção'),
      done('3', 'Pausas no dia a dia'),
      { n: '4', title: 'Limites saudáveis', sub: '3 de 4 sessões', tag: 'Agora', tagColor: '#F2C29A', dotBg: '#FAF8DF', dotFg: '#0B2620', dotBorder: '#FAF8DF', op: '1' },
      { n: '5', title: 'Energia e descanso', sub: 'Abre na próxima semana', tag: '', tagColor: '#FAF8DF', dotBg: 'transparent', dotFg: 'rgba(250,248,223,.8)', dotBorder: 'rgba(250,248,223,.3)', op: '.75' },
      { n: '6', title: 'Foco sem pressão', sub: 'Bloqueada', tag: '', tagColor: '#FAF8DF', dotBg: 'transparent', dotFg: 'rgba(250,248,223,.8)', dotBorder: 'rgba(250,248,223,.3)', op: '.75' }
    ];
    return { accent, weeks };
  }
}
</script>
</body>
</html>
