<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Good Loop — Perfil (app)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06140f}
a{color:#B7DBAD}a:hover{color:#FAF8DF}
.gl-m{background-image:linear-gradient(rgba(4,16,13,.25),rgba(4,16,13,.55)),url(../assets/bg-colinas.jpg);background-size:cover;background-position:15% center}
.glass{background:rgba(10,32,27,.44);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(250,248,223,.14)}
.glass-btn{background:rgba(250,248,223,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(250,248,223,.2);color:#FAF8DF;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 4px;color:#FAF8DF;text-decoration:none;border-bottom:1px solid rgba(250,248,223,.08)}
.row:hover{color:#FAF8DF;background:rgba(250,248,223,.04)}

</style>
</helmet>
<div class="gl-m" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 18px 18px; display: flex; flex-direction: column; gap: 14px; font-family: 'DM Sans', system-ui, sans-serif; color: #FAF8DF; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 500; font-size: 26px">Perfil</h1>
    <button class="glass-btn" aria-label="Notificações" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg></button>
  </header>

  <!-- Identity -->
  <section class="glass" style="border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 64px; height: 64px; border-radius: 50%; background: #E89D64; color: #2a1608; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-size: 24px; font-weight: 500">AS</span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: Outfit, sans-serif; font-size: 21px; font-weight: 500">Ana Souza</span>
        <span style="font-size: 13px; color: rgba(250,248,223,.8)">Acesso pela empresa · desde agosto</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
      <div style="border-radius: 16px; padding: 10px 4px; background: rgba(250,248,223,.06)"><div style="font-family: Outfit, sans-serif; font-size: 22px">15</div><div style="font-size: 11px; color: rgba(250,248,223,.8)">sessões</div></div>
      <div style="border-radius: 16px; padding: 10px 4px; background: rgba(250,248,223,.06)"><div style="font-family: Outfit, sans-serif; font-size: 22px">132</div><div style="font-size: 11px; color: rgba(250,248,223,.8)">minutos</div></div>
      <div style="border-radius: 16px; padding: 10px 4px; background: rgba(250,248,223,.06)"><div style="font-family: Outfit, sans-serif; font-size: 22px; color: #F2C29A">7</div><div style="font-size: 11px; color: rgba(250,248,223,.8)">dias seguidos</div></div>
    </div>
  </section>

  <!-- Preferences -->
  <section class="glass" style="border-radius: 24px; padding: 4px 14px">
    <a href="#" class="row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      <span style="flex: 1; font-size: 15px">Voz preferida</span><span style="font-size: 13px; color: rgba(250,248,223,.8)">Valeria</span>
    </a>
    <a href="#" class="row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg>
      <span style="flex: 1; font-size: 15px">Fones e teste estéreo</span><span style="font-size: 13px; color: #B7DBAD">Ok</span>
    </a>
    <div class="row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 3h6"></path></svg>
      <span id="lbl-rem" style="flex: 1; font-size: 15px">Lembretes inteligentes</span>
      <button role="switch" aria-checked="{{remChecked}}" aria-labelledby="lbl-rem" onClick="{{toggle}}" style="width: 52px; height: 30px; border-radius: 999px; border: none; cursor: pointer; padding: 3px; display: flex; justify-content: {{remJustify}}; background: {{remBg}}">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #FAF8DF"></span>
      </button>
    </div>
    <a href="#" class="row" style="border-bottom: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"></path><path d="M9.5 12l2 2 3.5-3.5"></path></svg>
      <span style="flex: 1; font-size: 15px">Privacidade e meus dados</span><span style="font-size: 13px; color: rgba(250,248,223,.8)">LGPD</span>
    </a>
  </section>

  <!-- Support -->
  <a href="PsiAgenda.dc.html" class="glass" style="border-radius: 24px; padding: 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #FAF8DF">
    <span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: rgba(61,177,137,.4); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; flex: 1">
      <span style="font-size: 15px; font-weight: 500">Falar com um psicólogo</span>
      <span style="font-size: 12px; color: rgba(250,248,223,.8)">Sessões com profissional registrado</span>
    </span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </a>

  <a href="#" style="align-self: center; font-size: 14px">Sair da conta</a>

  <div style="flex: 1"></div>

  <nav class="glass" aria-label="Navegação" style="height: 68px; border-radius: 999px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <a href="Mobile.dc.html" aria-label="Início" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></a>
    <a href="PsiAgenda.dc.html" aria-label="Terapia" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM12 13.6s-3-1.8-3-4a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 2.2-3 4-3 4z"></path></svg></a>
    <a href="Jornada.dc.html" aria-label="Minha jornada" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"></path></svg></a>
    <a href="Protocolos.dc.html" aria-label="Protocolos" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg></a>
    <a href="Beneficios.dc.html" aria-label="Benefícios" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path><path d="M12 9.5v5M9.5 12h5"></path></svg></a>
    <a href="Perfil.dc.html" aria-label="Perfil" aria-current="page" style="width: 48px; height: 48px; border-radius: 50%; background: #FAF8DF; color: #0B2620; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DB189","options":["#3DB189","#7AC69B","#E89D64","#2465AB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { rem: true }; }
  renderVals() {
    const accent = this.props.accent ?? '#3DB189';
    const on = this.state.rem;
    return {
      accent,
      remChecked: on ? 'true' : 'false',
      remBg: on ? accent : 'rgba(250,248,223,.2)',
      remJustify: on ? 'flex-end' : 'flex-start',
      toggle: () => this.setState({ rem: !this.state.rem })
    };
  }
}
</script>
</body>
</html>
