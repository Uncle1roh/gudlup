<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Good Loop — Sala de espera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06140f}
a{color:#B7DBAD}a:hover{color:#FAF8DF}
.gl-m{background-image:linear-gradient(rgba(4,16,13,.3),rgba(4,16,13,.6)),url(../assets/bg-colinas.jpg);background-size:cover;background-position:65% center}
.glass{background:rgba(10,32,27,.44);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(250,248,223,.14)}
.glass-btn{background:rgba(250,248,223,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(250,248,223,.2);color:#FAF8DF;cursor:pointer}

</style>
</helmet>
<div class="gl-m" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 18px 18px; display: flex; flex-direction: column; gap: 14px; font-family: 'DM Sans', system-ui, sans-serif; color: #FAF8DF; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px">
    <a href="PsiAgenda.dc.html" class="glass-btn" aria-label="Voltar" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 500; font-size: 22px">Sala de espera</h1>
      <span style="font-size: 12px; color: rgba(250,248,223,.8)">Dra. Marina Alves entra em 4 min</span>
    </div>
  </header>

  <!-- Self preview -->
  <section class="glass" style="border-radius: 28px; height: 220px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <span style="width: 88px; height: 88px; border-radius: 50%; background: #E89D64; color: #2a1608; display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-size: 30px">AS</span>
    <span style="position: absolute; left: 14px; bottom: 12px; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(6,20,15,.6)">Sua câmera</span>
    <div style="position: absolute; right: 12px; bottom: 10px; display: flex; gap: 8px">
      <button class="glass-btn" aria-label="Microfone ligado" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      <button class="glass-btn" aria-label="Câmera ligada" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg></button>
    </div>
  </section>

  <!-- Stereo test -->
  <section class="glass" style="border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 15px; font-weight: 500">Teste de fones</span>
      <button class="glass-btn" style="height: 36px; padding: 0 12px; border-radius: 999px; font: 500 13px 'DM Sans', sans-serif">Tocar som</button>
    </div>
    <span style="font-size: 13px; color: rgba(250,248,223,.85)">Em qual ouvido você escutou o som?</span>
    <div role="radiogroup" aria-label="Ouvido" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ears}}" as="e" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{e.checked}}" onClick="{{e.pick}}" style="height: 48px; border-radius: 999px; border: 1px solid rgba(250,248,223,.2); cursor: pointer; font: 600 14px 'DM Sans', sans-serif; background: {{e.bg}}; color: {{e.fg}}">{{e.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{answered}}" hint-placeholder-val="{{ true }}">
      <span style="font-size: 13px; color: #B7DBAD">Perfeito: áudio estéreo funcionando.</span>
    </sc-if>
  </section>

  <!-- Checklist -->
  <section class="glass" style="border-radius: 24px; padding: 8px 16px">
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7AC69B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>
        {{c}}
      </div>
    </sc-for>
  </section>

  <div style="flex: 1"></div>

  <a href="PsiChamada.dc.html" style="height: 58px; border-radius: 999px; background: #FAF8DF; color: #0B2620; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 16px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
    Entrar na chamada
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ear: 'esq' }; }
  renderVals() {
    const ears = [{ id: 'esq', label: 'Esquerdo' }, { id: 'dir', label: 'Direito' }].map((e) => {
      const on = this.state.ear === e.id;
      return { ...e, checked: on ? 'true' : 'false', bg: on ? '#FAF8DF' : 'transparent', fg: on ? '#0B2620' : '#FAF8DF', pick: () => this.setState({ ear: e.id }) };
    });
    return {
      ears,
      answered: this.state.ear === 'esq',
      checks: ['Fones com fio conectados', 'Câmera e microfone liberados', 'Lugar tranquilo e confortável']
    };
  }
}
</script>
</body>
</html>
