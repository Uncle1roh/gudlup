<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Good Loop — Benefícios (app)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06140f}
a{color:#B7DBAD}a:hover{color:#FAF8DF}
.gl-m{background-image:linear-gradient(rgba(4,16,13,.25),rgba(4,16,13,.55)),url(../assets/bg-colinas.jpg);background-size:cover;background-position:55% center}
.glass{background:rgba(10,32,27,.44);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(250,248,223,.14)}
.glass-btn{background:rgba(250,248,223,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(250,248,223,.2);color:#FAF8DF;cursor:pointer}

</style>
</helmet>
<div class="gl-m" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 18px 18px; display: flex; flex-direction: column; gap: 14px; font-family: 'DM Sans', system-ui, sans-serif; color: #FAF8DF; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 500; font-size: 26px">Benefícios</h1>
    <a href="#" class="glass-btn" style="height: 36px; padding: 0 12px; border-radius: 999px; display: flex; align-items: center; font-size: 13px; text-decoration: none">Como ganhar Loops</a>
  </header>

  <!-- Balance -->
  <section class="glass" style="border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: rgba(250,248,223,.8)">Seu saldo</span>
        <span style="font-family: Outfit, sans-serif; font-size: 40px; font-weight: 400; line-height: 1">1.240 <span style="font-size: 18px; color: #B7DBAD">Loops</span></span>
      </div>
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 19.5c-3.2-2-5.2-4.2-5.2-6.6a2.6 2.6 0 0 1 5.2-.6 2.6 2.6 0 0 1 5.2.6c0 2.4-2 4.6-5.2 6.6z"></path><circle cx="12" cy="8.2" r="1.7"></circle></svg>
    </div>
    <div style="height: 8px; border-radius: 999px; background: rgba(250,248,223,.14)"><div style="width: 82%; height: 100%; border-radius: 999px; background: {{accent}}"></div></div>
    <span style="font-size: 12px; color: rgba(250,248,223,.8)">Cada sessão ouvida soma pontos · conquistas dão Loops bônus</span>
  </section>

  <!-- Collective challenge -->
  <section class="glass" style="border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #F2C29A">Desafio coletivo</span>
      <span style="font-size: 12px; color: rgba(250,248,223,.75)">Termina em 5 dias</span>
    </div>
    <span style="font-family: Outfit, sans-serif; font-size: 19px; line-height: 1.2">Outubro em pausa: 10 mil sessões em São Paulo</span>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; height: 8px; border-radius: 999px; background: rgba(250,248,223,.14)"><div style="width: 68%; height: 100%; border-radius: 999px; background: #E89D64"></div></div>
      <span style="font-size: 13px; font-weight: 600">68%</span>
    </div>
  </section>

  <!-- Tabs -->
  <div role="tablist" aria-label="Benefícios" style="display: flex; gap: 8px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer; font: 500 14px 'DM Sans', sans-serif; border: 1px solid rgba(250,248,223,.2); background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
    </sc-for>
  </div>

  <!-- Benefits -->
  <section style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="b" hint-placeholder-count="4">
      <article class="glass" style="border-radius: 22px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{b.tint}}; color: #FAF8DF">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 500">{{b.name}}</span>
          <span style="font-size: 12px; color: rgba(250,248,223,.8)">{{b.sub}}</span>
        </div>
        <button class="glass-btn" style="height: 40px; padding: 0 14px; border-radius: 999px; font: 600 13px 'DM Sans', sans-serif; flex: none">{{b.cost}}</button>
      </article>
    </sc-for>
  </section>

  <div style="flex: 1"></div>

  <nav class="glass" aria-label="Navegação" style="height: 68px; border-radius: 999px; display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <a href="Mobile.dc.html" aria-label="Início" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></a>
    <a href="PsiAgenda.dc.html" aria-label="Terapia" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4zM12 13.6s-3-1.8-3-4a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 2.2-3 4-3 4z"></path></svg></a>
    <a href="Jornada.dc.html" aria-label="Minha jornada" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"></path></svg></a>
    <a href="Protocolos.dc.html" aria-label="Protocolos" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg></a>
    <a href="Beneficios.dc.html" aria-label="Benefícios" aria-current="page" style="width: 48px; height: 48px; border-radius: 50%; background: #FAF8DF; color: #0B2620; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path><path d="M12 9.5v5M9.5 12h5"></path></svg></a>
    <a href="Perfil.dc.html" aria-label="Perfil" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #FAF8DF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DB189","options":["#3DB189","#7AC69B","#E89D64","#2465AB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'disp' }; }
  renderVals() {
    const accent = this.props.accent ?? '#3DB189';
    const tabs = [{ id: 'disp', label: 'Disponíveis' }, { id: 'resg', label: 'Resgatados' }].map((t) => {
      const on = this.state.tab === t.id;
      return { ...t, sel: on ? 'true' : 'false', bg: on ? '#FAF8DF' : 'rgba(250,248,223,.08)', fg: on ? '#0B2620' : '#FAF8DF', pick: () => this.setState({ tab: t.id }) };
    });
    const available = [
      { name: 'Aula de yoga online', sub: '1 mês de acesso', cost: '800 Loops', tint: 'rgba(61,177,137,.45)', icon: 'M12 5a2 2 0 1 0 0 .1M5 10l7 2 7-2M12 12v4l-4 4M12 16l4 4' },
      { name: 'Consulta com nutricionista', sub: 'Online · 1 sessão', cost: '1.500 Loops', tint: 'rgba(232,157,100,.45)', icon: 'M12 7c-3-3-8-1-7 4 1 4 4 9 7 9s6-5 7-9c1-5-4-7-7-4zM12 7c0-2 1-3 3-4' },
      { name: 'Meditação em grupo', sub: 'Encontro ao vivo · 45 min', cost: '500 Loops', tint: 'rgba(36,101,171,.5)', icon: 'M3 12c3-4 6 4 9 0s6 4 9 0M3 17c3-4 6 4 9 0s6 4 9 0' },
      { name: 'Avaliação de sono', sub: 'Com especialista', cost: '1.200 Loops', tint: 'rgba(83,51,96,.6)', icon: 'M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z' }
    ];
    const redeemed = [
      { name: 'Meditação em grupo', sub: 'Resgatado em 12 de outubro', cost: 'Ver', tint: 'rgba(36,101,171,.5)', icon: 'M3 12c3-4 6 4 9 0s6 4 9 0M3 17c3-4 6 4 9 0s6 4 9 0' }
    ];
    return { accent, tabs, items: this.state.tab === 'disp' ? available : redeemed };
  }
}
</script>
</body>
</html>
