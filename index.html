<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- The light ground, which is what the app opens on. `src/ui2/ground.ts`
         rewrites this the moment it loads if the person chose the dark one. -->
    <meta name="theme-color" content="#F5EEE4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Good Loop</title>

    <!-- The tab, and the icon a phone keeps when the app is added to the home
         screen. Both are the official mark from `Good Loop Visual ID/`, scaled
         and nothing else. The touch icon is the cream mark on the brand's dark
         green because iOS puts BLACK behind a transparent one. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Type: Roboto for everything, self-hosted — never fetched from Google,
         so no viewer's address reaches a third party. Preload the Latin roman
         face, which every screen needs, to avoid a flash of fallback text. -->
    <link rel="preload" href="/fonts/Roboto-Roman-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Instrument Sans, for the public pages and the door only (the app keeps
         Roboto). Self-hosted exactly like the rest: the spec for this round
         asked for a fonts.googleapis.com <link>, and that is the one line of
         it we did not do. A <link> there makes every visitor's browser
         announce its IP to a third party before the first word is drawn, and
         the landing page is the FIRST thing a stranger loads. See
         README_FONTS.md. Preloaded because the landing's headline is set in
         it and nothing else on that page is. -->
    <link rel="preload" href="/fonts/InstrumentSans-Roman-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The landing and the door stand on this photograph, full-viewport. It
         is the largest thing either page loads and the only one that matters
         before the fold, so the browser is told about it in the head rather
         than discovering it when React mounts.

         It is the DEFAULT background, not necessarily the one on screen: the
         two pictures are a setting now (`src/app/backgrounds.ts`) and the
         commercial console can change them. A preload can only name one file,
         and the shipped one is the right guess — when it has been changed,
         this costs one request that the browser drops, and the replacement
         loads as it always would. -->
    <link rel="preload" as="image" href="/media/landing-back.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
